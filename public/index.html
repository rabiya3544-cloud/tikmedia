<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0d12">
<meta name="color-scheme" content="dark">
<title>Tok Player — Player & Downloader</title>
<style>
  :root{
    --bg:#0a0d12; --surface:#131922; --surface2:#1b2431; --line:#26313f;
    --text:#e8eef6; --muted:#8b9bb0; --accent:#25f4ee; --accent2:#fe2c55;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1100px 560px at 50% -12%, #16202e 0%, var(--bg) 62%);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100dvh;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  [hidden]{display:none!important}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:10px;padding:4px 2px 14px}
  .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        color:#06121a;font-weight:800;font-size:15px;flex:0 0 auto}
  .brand{min-width:0;flex:1}
  h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
  .sub{font-size:11px;color:var(--muted);margin-top:2px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- header action button ---------- */
  .hbtn{
    flex:0 0 auto;width:38px;height:38px;border-radius:11px;
    display:grid;place-items:center;
    background:var(--surface2);border:1px solid var(--line);color:var(--muted);
    text-decoration:none;transition:transform .12s, color .15s, border-color .15s, background .15s;
  }
  .hbtn:hover{color:var(--accent);border-color:var(--accent);background:#16202c}
  .hbtn:active{transform:scale(.92)}
  .hbtn .i{width:20px;height:20px}

  /* ---------- player ---------- */
  .player{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;
          height:min(56dvh,460px);border:1px solid var(--line);
          box-shadow:0 12px 34px rgba(0,0,0,.5);margin-bottom:12px}
  video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
               align-items:center;justify-content:center;color:#4d5c70;font-size:12.5px;
               pointer-events:none;text-align:center;padding:20px}
  .spinner{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;
           border-radius:50%;border:3px solid rgba(255,255,255,.15);
           border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .overlay{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:2px;
           padding:26px 10px 8px;transition:opacity .25s;
           background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.45) 52%,transparent)}
  .player.hide-ui .overlay{opacity:0;pointer-events:none}
  .row{display:flex;align-items:center;gap:6px}
  .spacer{flex:1}
  .time{font-size:11px;color:#cbd5e1;font-variant-numeric:tabular-nums;letter-spacing:.3px}

  /* ---------- buttons / controls ---------- */
  .icon{width:34px;height:34px;border-radius:10px;border:0;background:rgba(255,255,255,.09);
        color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
        transition:transform .12s, background .15s}
  .icon:active{transform:scale(.92)}
  .icon.sm{width:30px;height:30px;border-radius:9px}
  .i{width:18px;height:18px;fill:currentColor;display:block}
  .i.big{width:46px;height:46px;opacity:.35}
  .chip{height:30px;min-width:42px;padding:0 9px;border-radius:10px;border:0;
        background:rgba(255,255,255,.09);color:#fff;font-size:12px;font-weight:700;
        cursor:pointer;flex:0 0 auto}
  .chip:active{transform:scale(.94)}

  /* ---------- seek ---------- */
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;
                    background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
    background:linear-gradient(to right,var(--accent) var(--p,0%), rgba(255,255,255,.25) var(--p,0%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
    border-radius:50%;background:#fff;margin-top:-4.5px;
    box-shadow:0 0 0 4px rgba(37,244,238,.16)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
        padding:12px;margin-bottom:10px}
  .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
       color:var(--muted);margin-bottom:7px}
  .field{display:flex;gap:8px;align-items:center}
  input[type=url]{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);
    background:#0e141c;color:var(--text);padding:0 12px;font-size:13px;outline:none}
  input[type=url]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,244,238,.13)}
  .field .icon{width:44px;height:44px;border-radius:12px;background:var(--surface2);
               border:1px solid var(--line)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;
       padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);
       color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;width:100%;
       transition:transform .12s, filter .15s;font-family:inherit}
  .btn:active{transform:scale(.975)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#22a7f0);
               border-color:transparent;color:#04121a}
  .btn.primary.big{height:48px;font-size:14.5px}
  .btn.busy{background:linear-gradient(135deg,var(--accent2),#ff6b81);color:#1a0308}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .progress{height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;
            margin-top:9px;display:none}
  .progress.on{display:block}
  .progress > i{display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .18s ease}

  .hint{font-size:11px;color:var(--muted);line-height:1.5;margin:9px 2px 0}
  .foot{font-size:10.5px;color:#55657a;text-align:center;margin:16px 0 0}

  /* ---------- history ---------- */
  .cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .cardhead > span{font-size:11px;font-weight:700;letter-spacing:.7px;
                   text-transform:uppercase;color:var(--muted)}
  .linkbtn{background:none;border:0;color:var(--accent);font-size:12px;font-weight:600;
           cursor:pointer;padding:4px 2px;font-family:inherit}
  .hist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;
        -webkit-overflow-scrolling:touch}
  .hitem{display:flex;align-items:center;gap:7px;background:var(--surface2);
         border:1px solid var(--line);border-radius:11px;padding:6px 7px}
  .hitem .i{margin-left:3px;color:#5d7089;flex:0 0 auto}
  .hitem .u{flex:1;min-width:0;font-size:11.5px;color:#b9c6d6;overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translate(-50%,22px);background:#1b2431;border:1px solid var(--line);
    color:var(--text);padding:11px 15px;border-radius:13px;font-size:12.5px;line-height:1.45;
    opacity:0;pointer-events:none;transition:.26s ease;z-index:60;max-width:min(90vw,420px);
    text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.55)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- fullscreen ---------- */
  .player:fullscreen{height:100dvh;border-radius:0;border:0}
  .player:fullscreen video{height:100dvh}
  .player:-webkit-full-screen{height:100dvh;border-radius:0}
  .player:-webkit-full-screen video{height:100dvh}
</style>
</head>
<body>

<!-- ============ SVG SPRITE ============ -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4zm13.2 1.8L19.4 8.6l1.4 1.4-2.2 2.2 2.2 2.2-1.4 1.4-2.2-2.2-2.2 2.2-1.4-1.4 2.2-2.2-2.2-2.2 1.4-1.4z"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 4h7v2H6v5H4V4zm9 0h7v7h-2V6h-5V4zM4 13h2v5h5v2H4v-7zm14 0h2v7h-7v-2h5v-5z"/></symbol>
  <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M9 4h2v7H4V9h5V4zm4 0h2v5h5v2h-7V4zM4 13h7v7H9v-5H4v-2zm9 0h7v2h-5v5h-2v-7z"/></symbol>
  <symbol id="i-pip" viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v10h14V7H5zm8 4h5v4h-5v-4z"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M11 3h2v10.17l3.59-3.58L18 11l-6 6-6-6 1.41-1.41L11 13.17V3zM5 19h14v2H5v-2z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M8 2h11v14h-2V4H8V2zM5 6h11v16H5V6zm2 2v12h7V8H7z"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.41l-8.29 8.3-1.42-1.42L17.59 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></symbol>
  <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 2h6v2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V2zm0 4H7v14h10V6h-2v2H9V6z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 8h12l-1 13H7L6 8z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v6l5 3 1-1.7-4-2.3V7z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></symbol>
  <!-- braces icon for the JSON link -->
  <symbol id="i-json" viewBox="0 0 24 24">
    <path d="M8 3.5H6.5Q4 3.5 4 6v3.5Q4 12 1.5 12 4 12 4 14.5V18q0 2.5 2.5 2.5H8"
          style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/>
    <path d="M16 3.5h1.5Q20 3.5 20 6v3.5Q20 12 22.5 12 20 12 20 14.5V18q0 2.5-2.5 2.5H16"
          style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/>
  </symbol>
</svg>

<div class="wrap">

  <header>
    <div class="logo">▶</div>
    <div class="brand">
      <h1>Tok Player</h1>
      <div class="sub">Player &amp; downloader for direct video links</div>
    </div>
    <a class="hbtn" href="json.html" aria-label="Open JSON page" title="JSON">
      <svg class="i"><use href="#i-json"></use></svg>
    </a>
  </header>

  <!-- ================= PLAYER ================= -->
  <div class="player" id="player">
    <video id="video" playsinline preload="metadata" webkit-playsinline></video>

    <div class="placeholder" id="placeholder">
      <svg class="i big"><use href="#i-play"></use></svg>
      <span>Paste a video link below to start</span>
    </div>

    <div class="spinner" id="spinner" hidden></div>

    <div class="overlay">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="row">
        <button id="playBtn" class="icon" aria-label="Play / Pause">
          <svg class="i"><use id="playIcon" href="#i-play"></use></svg>
        </button>
        <span class="time" id="time">0:00 / 0:00</span>
        <span class="spacer"></span>
        <button id="muteBtn" class="icon" aria-label="Mute">
          <svg class="i"><use id="muteIcon" href="#i-vol"></use></svg>
        </button>
        <button id="speedBtn" class="chip" aria-label="Playback speed">1×</button>
        <button id="pipBtn" class="icon" aria-label="Picture in picture">
          <svg class="i"><use href="#i-pip"></use></svg>
        </button>
        <button id="fsBtn" class="icon" aria-label="Fullscreen">
          <svg class="i"><use id="fsIcon" href="#i-expand"></use></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= URL ================= -->
  <section class="card">
    <label class="lbl" for="url">Video link</label>
    <div class="field">
      <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://video-va.tiktokv.com/…mp4">
      <button id="pasteBtn" class="icon" aria-label="Paste from clipboard">
        <svg class="i"><use href="#i-paste"></use></svg>
      </button>
    </div>
    <div class="grid2" style="margin-top:9px">
      <button id="loadBtn" class="btn primary">
        <svg class="i"><use href="#i-play"></use></svg>Load
      </button>
      <button id="openBtn" class="btn">
        <svg class="i"><use href="#i-open"></use></svg>Open
      </button>
    </div>
  </section>

  <!-- ================= DOWNLOAD ================= -->
  <section class="card">
    <button id="dlBtn" class="btn primary big">
      <svg class="i"><use href="#i-dl"></use></svg><span id="dlLabel">Download video</span>
    </button>
    <div class="progress" id="prog"><i id="progBar"></i></div>
    <div class="grid2" style="margin-top:9px">
      <button id="copyBtn" class="btn">
        <svg class="i"><use href="#i-copy"></use></svg>Copy link
      </button>
      <button id="clrBtn" class="btn">
        <svg class="i"><use href="#i-x"></use></svg>Clear
      </button>
    </div>
    <p class="hint">If the CDN blocks direct saving, the file opens in a new tab — long-press the
      video and choose <b>“Save video”</b>.</p>
  </section>

  <!-- ================= HISTORY ================= -->
  <section class="card" id="histWrap" hidden>
    <div class="cardhead">
      <span>Recent</span>
      <button id="histClear" class="linkbtn">Clear all</button>
    </div>
    <div class="hist" id="hist"></div>
  </section>

  <p class="foot">Only download content you have the rights to.</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ---------------- element refs ---------------- */
  const $ = id => document.getElementById(id);
  const els = {
    player: $('player'), video: $('video'), placeholder: $('placeholder'), spinner: $('spinner'),
    seek: $('seek'), time: $('time'), playBtn: $('playBtn'), playIcon: $('playIcon'),
    muteBtn: $('muteBtn'), muteIcon: $('muteIcon'), speedBtn: $('speedBtn'),
    pipBtn: $('pipBtn'), fsBtn: $('fsBtn'), fsIcon: $('fsIcon'),
    url: $('url'), pasteBtn: $('pasteBtn'), loadBtn: $('loadBtn'), openBtn: $('openBtn'),
    dlBtn: $('dlBtn'), dlLabel: $('dlLabel'), prog: $('prog'), progBar: $('progBar'),
    copyBtn: $('copyBtn'), clrBtn: $('clrBtn'),
    histWrap: $('histWrap'), hist: $('hist'), histClear: $('histClear'),
    toast: $('toast')
  };

  const video = els.video;
  const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
  let speedIdx = 2;

  let current = null;      // { url, name }
  let abortCtl = null;     // active download controller
  let dragging = false;
  let hideUiTimer = null;

  /* ---------------- helpers ---------------- */
  let toastTimer;
  function toast(msg, ms = 2400) {
    els.toast.textContent = msg;
    els.toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('on'), ms);
  }

  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
  }

  function fmtBytes(b) {
    if (!b) return '0 KB';
    if (b > 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
    if (b > 1048576) return (b / 1048576).toFixed(1) + ' MB';
    return Math.round(b / 1024) + ' KB';
  }

  function prettyUrl(u) {
    try {
      const p = new URL(u);
      const last = p.pathname.split('/').filter(Boolean).pop() || '';
      return p.hostname + '/' + (last.length > 22 ? last.slice(0, 22) + '…' : last);
    } catch { return u.slice(0, 46) + '…'; }
  }

  function suggestName(u) {
    try {
      const p = new URL(u);
      let base = decodeURIComponent(p.pathname.split('/').filter(Boolean).pop() || '');
      base = base.replace(/[^\w.\-]+/g, '_').slice(0, 48);
      if (!/\.(mp4|m4v|webm|mov|ogg)$/i.test(base)) base = (base || 'video') + '.mp4';
      return 'tiktok_' + base;
    } catch {
      return 'video_' + Date.now() + '.mp4';
    }
  }

  /* Is this URL already a direct, playable media file? */
  function isDirectMedia(u) {
    try {
      const url = new URL(u);
      if (/\.(mp4|m4v|webm|ogg|ogv|mov|m3u8)(\?|#|$)/i.test(url.pathname + url.search)) return true;
      if (/mime_type=video/i.test(u)) return true;
      if (/(^|\.)(tos|tiktokcdn|tiktokv|muscdn|byteoversea|akamaized|cloudfront)\./i.test(url.hostname)) return true;
      return false;
    } catch { return false; }
  }

  /* ---------------- player core ---------------- */
  function setPlayIcon(playing) {
    els.playIcon.setAttribute('href', playing ? '#i-pause' : '#i-play');
    els.playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }

  function setMuteIcon() {
    els.muteIcon.setAttribute('href', video.muted || video.volume === 0 ? '#i-mute' : '#i-vol');
  }

  function updateTime() {
    const d = video.duration || 0;
    const c = video.currentTime || 0;
    if (!dragging) {
      const pct = d ? (c / d) * 100 : 0;
      els.seek.value = Math.round(pct * 10);
      els.seek.style.setProperty('--p', pct + '%');
      els.time.textContent = fmt(c) + ' / ' + fmt(d);
    }
  }

  function togglePlay() {
    if (!video.src) { toast('Load a video first'); return; }
    if (video.paused) video.play().catch(() => toast('Playback blocked — tap again'));
    else video.pause();
  }

  function loadVideo(rawUrl, opts) {
    opts = opts || {};
    let url = String(rawUrl || '').trim();
    if (!url) { toast('Paste a video link first'); return; }
    if (!/^(https?:|blob:|data:)/i.test(url)) url = 'https://' + url;

    current = { url: url, name: suggestName(url) };
    els.url.value = url;
    els.placeholder.hidden = true;
    els.spinner.hidden = false;

    video.pause();
    video.removeAttribute('src');
    video.load();
    video.src = url;
    video.playbackRate = SPEEDS[speedIdx];
    video.load();
    video.play().catch(() => { /* autoplay may be blocked — fine */ });

    if (opts.scroll !== false) {
      try { els.player.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    }
  }

  /* ---------------- video events ---------------- */
  video.addEventListener('loadedmetadata', () => {
    els.spinner.hidden = true;
    updateTime();
    if (current) pushHistory(current.url);
  });
  video.addEventListener('canplay', () => { els.spinner.hidden = true; });
  video.addEventListener('waiting', () => { els.spinner.hidden = false; });
  video.addEventListener('playing', () => { els.spinner.hidden = true; setPlayIcon(true); });
  video.addEventListener('play', () => setPlayIcon(true));
  video.addEventListener('pause', () => setPlayIcon(false));
  video.addEventListener('timeupdate', updateTime);
  video.addEventListener('volumechange', setMuteIcon);
  video.addEventListener('ended', () => setPlayIcon(false));
  video.addEventListener('click', togglePlay);

  video.addEventListener('error', () => {
    els.spinner.hidden = true;
    if (!current) return;
    toast('Could not load this file. The link may be expired or blocked by the CDN.', 3600);
  });

  /* ---------------- seek ---------------- */
  els.seek.addEventListener('input', () => {
    dragging = true;
    const d = video.duration || 0;
    const p = els.seek.value / 1000;
    els.seek.style.setProperty('--p', (p * 100) + '%');
    if (d) els.time.textContent = fmt(p * d) + ' / ' + fmt(d);
  });
  els.seek.addEventListener('change', () => {
    const d = video.duration || 0;
    if (d) video.currentTime = (els.seek.value / 1000) * d;
    dragging = false;
    updateTime();
  });
  document.addEventListener('pointerup', () => { if (dragging) dragging = false; });

  /* ---------------- control buttons ---------------- */
  els.playBtn.addEventListener('click', togglePlay);

  els.muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    if (!video.muted && video.volume === 0) video.volume = 1;
    setMuteIcon();
  });

  els.speedBtn.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    const s = SPEEDS[speedIdx];
    video.playbackRate = s;
    els.speedBtn.textContent = s + '×';
    toast('Speed ' + s + '×', 1000);
  });

  els.pipBtn.addEventListener('click', async () => {
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else if (video.requestPictureInPicture) await video.requestPictureInPicture();
      else toast('Picture-in-picture not supported here');
    } catch (e) { toast('Picture-in-picture unavailable'); }
  });
  if (!document.pictureInPictureEnabled) els.pipBtn.style.display = 'none';

  function toggleFullscreen() {
    const p = els.player;
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (inFs) {
      (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
      return;
    }
    const req = p.requestFullscreen || p.webkitRequestFullscreen;
    if (req) { req.call(p); return; }
    if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS Safari
    else toast('Fullscreen not supported');
  }
  els.fsBtn.addEventListener('click', toggleFullscreen);

  function syncFsIcon() {
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    els.fsIcon.setAttribute('href', inFs ? '#i-shrink' : '#i-expand');
  }
  document.addEventListener('fullscreenchange', syncFsIcon);
  document.addEventListener('webkitfullscreenchange', syncFsIcon);

  /* ---------------- auto-hide UI on idle ---------------- */
  function pokeUi() {
    els.player.classList.remove('hide-ui');
    clearTimeout(hideUiTimer);
    if (!video.paused) {
      hideUiTimer = setTimeout(() => els.player.classList.add('hide-ui'), 3200);
    }
  }
  ['pointerdown', 'pointermove', 'touchstart'].forEach(ev =>
    els.player.addEventListener(ev, pokeUi, { passive: true }));
  video.addEventListener('play', pokeUi);

  /* ---------------- clipboard ---------------- */
  els.pasteBtn.addEventListener('click', async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (t) { els.url.value = t.trim(); toast('Pasted'); }
      else toast('Clipboard is empty');
    } catch { toast('Clipboard blocked — paste manually'); }
  });

  els.copyBtn.addEventListener('click', async () => {
    if (!current) return toast('Nothing to copy');
    try { await navigator.clipboard.writeText(current.url); toast('Link copied'); }
    catch { toast('Copy failed — select the field manually'); }
  });

  els.clrBtn.addEventListener('click', () => {
    video.pause();
    video.removeAttribute('src');
    video.load();
    current = null;
    els.url.value = '';
    els.placeholder.hidden = false;
    els.time.textContent = '0:00 / 0:00';
    els.seek.value = 0;
    els.seek.style.setProperty('--p', '0%');
    setPlayIcon(false);
    toast('Cleared');
  });

  els.openBtn.addEventListener('click', () => {
    const u = els.url.value.trim() || (current && current.url);
    if (!u) return toast('Nothing to open');
    window.open(u, '_blank', 'noopener');
  });

  /* ---------------- load / resolve ---------------- */
  async function resolveTikTok(u) {
    const res = await fetch('https://tikwm.com/api/?url=' + encodeURIComponent(u), {
      headers: { 'Accept': 'application/json' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j || j.code !== 0 || !j.data) throw new Error((j && j.msg) || 'Resolve failed');
    const d = j.data;
    const direct = d.hdplay || d.play || d.wmplay;
    if (!direct) throw new Error('No stream returned');
    return direct;
  }

  async function handleLoad() {
    const raw = els.url.value.trim();
    if (!raw) return toast('Paste a video link first');

    if (isDirectMedia(raw)) { loadVideo(raw); return; }

    // Not obviously a file — try the resolver (TikTok share / page links)
    els.loadBtn.disabled = true;
    toast('Resolving link…', 1600);
    try {
      const direct = await resolveTikTok(raw);
      loadVideo(direct);
      toast('Resolved ✓');
    } catch (e) {
      toast('Resolve failed — trying the link directly');
      loadVideo(raw);
    } finally {
      els.loadBtn.disabled = false;
    }
  }

  els.loadBtn.addEventListener('click', handleLoad);
  els.url.addEventListener('keydown', e => { if (e.key === 'Enter') handleLoad(); });

  /* ---------------- download ---------------- */
  function setDlBusy(busy, label, pct) {
    els.dlBtn.classList.toggle('busy', !!busy);
    els.dlLabel.textContent = busy ? (label || 'Downloading…') : 'Download video';
    els.prog.classList.toggle('on', !!busy);
    if (busy) els.progBar.style.width = (pct == null ? 35 : Math.max(2, pct)) + '%';
    else els.progBar.style.width = '0%';
  }

  function openFallback(url, name) {
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Direct save blocked — opened in a new tab. Long-press the video → “Save video”.', 4600);
  }

  async function downloadCurrent() {
    if (!current || !current.url) return toast('Load a video first');

    const url = current.url;
    const name = current.name || suggestName(url);
    abortCtl = new AbortController();
    setDlBusy(true, '0%', 0);

    try {
      const res = await fetch(url, {
        signal: abortCtl.signal,
        mode: 'cors',
        credentials: 'omit',
        cache: 'no-store'
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const total = Number(res.headers.get('content-length')) || 0;
      let blob;

      if (res.body && typeof res.body.getReader === 'function') {
        const reader = res.body.getReader();
        const chunks = [];
        let received = 0;

        for (;;) {
          const step = await reader.read();
          if (step.done) break;
          chunks.push(step.value);
          received += step.value.length;
          if (total) {
            const pct = Math.min(100, (received / total) * 100);
            setDlBusy(true, Math.round(pct) + '%', pct);
          } else {
            setDlBusy(true, fmtBytes(received), null);
          }
        }
        blob = new Blob(chunks, { type: res.headers.get('content-type') || 'video/mp4' });
      } else {
        setDlBusy(true, 'Downloading…', null);
        blob = await res.blob();
      }

      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(objUrl), 60000);

      setDlBusy(true, '100%', 100);
      toast('Saved ✓ ' + fmtBytes(blob.size), 3000);
    } catch (err) {
      if (err && err.name === 'AbortError') toast('Download cancelled');
      else openFallback(url, name);
    } finally {
      abortCtl = null;
      setTimeout(() => setDlBusy(false), 500);
    }
  }

  els.dlBtn.addEventListener('click', () => {
    if (abortCtl) { abortCtl.abort(); return; }   // acts as Cancel while running
    downloadCurrent();
  });

  /* ---------------- history ---------------- */
  const HKEY = 'tokplayer.history.v1';

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HKEY)) || []; }
    catch { return []; }
  }
  function saveHistory(h) {
    try { localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 12))); } catch (e) {}
  }
  function pushHistory(url) {
    const h = getHistory().filter(x => x.url !== url);
    h.unshift({ url: url, ts: Date.now() });
    saveHistory(h);
    renderHistory();
  }
  function renderHistory() {
    const h = getHistory();
    els.histWrap.hidden = h.length === 0;
    els.hist.innerHTML = '';

    h.forEach(item => {
      const row = document.createElement('div');
      row.className = 'hitem';
      row.innerHTML =
        '<svg class="i"><use href="#i-clock"></use></svg>' +
        '<span class="u"></span>' +
        '<button class="icon sm" data-act="load" aria-label="Load">' +
          '<svg class="i"><use href="#i-play"></use></svg></button>' +
        '<button class="icon sm" data-act="del" aria-label="Delete">' +
          '<svg class="i"><use href="#i-x"></use></svg></button>';

      row.querySelector('.u').textContent = prettyUrl(item.url);
      row.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (btn && btn.dataset.act === 'del') {
          saveHistory(getHistory().filter(x => x.url !== item.url));
          renderHistory();
          return;
        }
        els.url.value = item.url;
        loadVideo(item.url);
      });
      els.hist.appendChild(row);
    });
  }

  els.histClear.addEventListener('click', () => {
    saveHistory([]);
    renderHistory();
    toast('History cleared');
  });

  /* ---------------- keyboard shortcuts (desktop) ---------------- */
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    switch (e.key) {
      case ' ': case 'k': e.preventDefault(); togglePlay(); break;
      case 'ArrowRight': video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); break;
      case 'ArrowLeft':  video.currentTime = Math.max(0, video.currentTime - 5); break;
      case 'ArrowUp':    e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); break;
      case 'ArrowDown':  e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); break;
      case 'm': video.muted = !video.muted; setMuteIcon(); break;
      case 'f': toggleFullscreen(); break;
    }
  });

  /* ---------------- init ---------------- */
  setPlayIcon(false);
  setMuteIcon();
  renderHistory();

  // Auto-load the last used link (without playing)
  (function restore() {
    const h = getHistory();
    if (h.length && h[0].url) {
      els.url.value = h[0].url;
    }
  })();

  // Expose a tiny API for automation / embedding
  window.TokPlayer = { load: loadVideo, download: downloadCurrent, get current() { return current; } };
})();
</script>
</body>
</html>
